name: Validate Thier Decor

on:
  push:
    branches:
      - main
      - migration-prep
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript-and-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: |
          node --check td-config.js
          node --check app.js
          node --check analytics-notifications.js
          node --check sw.js
          node --check firebase-config.js
          node --check supabase-config.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < thier-decor-api.js
      - name: Test PBKDF2 compatibility
        run: |
          node --test tests/pbkdf2-compat.test.mjs
          node --test tests/pbkdf2-worker-compat.test.mjs
      - name: Validate SQL statement syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = [
              Path("THIER_DECOR_SUPABASE_SCHEMA_FIXED_V2.sql"),
              Path("THIER_DECOR_FINAL_SECURITY_AND_ORDER_MUTATIONS_REVIEW.sql"),
              Path("THIER_DECOR_CUSTOMER_PHONE_UNIQUE_REVIEW.sql"),
              Path("THIER_DECOR_ORDER_SECURITY_REVIEW.sql"),
              Path("THIER_DECOR_CUSTOMER_POINTS_ADDRESS_MIGRATION_REVIEW.sql"),
              Path("THIER_DECOR_LOYALTY_REDEMPTION_ATOMIC_REVIEW.sql"),
              Path("THIER_DECOR_VISIT_TRACKING_SAFE_RPC_REVIEW.sql"),
          ]
          for path in files:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"SQL statements parsed: {path}")
          PY
